# Rules apply in order: an entry belongs to the first rule that matches it.

# .NET diagnostic sockets encode a PID and process start ticks.
[[rule]]
label = "dotnet diagnostic socket"
under = ["/tmp"]
depth = 2
type = "socket"
name = 'dotnet-diagnostic-(?P<pid>[0-9]+)-(?P<start>[0-9]+)-socket'
idle = "0"

# MSBuild sockets encode only a PID.
[[rule]]
label = "MSBuild socket"
under = ["/tmp"]
depth = 2
type = "socket"
name = 'MSBuild(?P<pid>[0-9]+)'
idle = "0"

# Other sockets rely on the bound-socket check.
[[rule]]
label = "socket"
under = ["/tmp"]
depth = 2
type = "socket"
idle = "0"

# CLR debugger pipes encode a PID and process start ticks.
[[rule]]
label = "clr-debug-pipe"
under = ["/tmp"]
depth = 2
type = "fifo"
name = 'clr-debug-pipe-(?P<pid>[0-9]+)-(?P<start>[0-9]+)-(?:in|out)'
idle = "0"

# Numbered MSBuild working directories encode a PID.
[[rule]]
label = "MSBuild dir"
under = ["/tmp"]
depth = 2
type = "directory"
name = 'MSBuild(?P<pid>[0-9]+)'
idle = "0"

# Discard idle MSBuild temporary directories.
[[rule]]
label = "MSBuildTemp"
under = ["/tmp"]
depth = 2
type = "directory"
name = 'MSBuildTemp.*'
idle = "60min"

# Discard empty NuGet case-sensitivity probes.
[[rule]]
label = "NuGet probe"
under = ["/tmp"]
depth = 1
type = "file"
name = 'CASESENSITIVETEST.*'
empty = true
idle = "60min"

# Discard empty .NET SDK advertising-manifest directories. Their parents then match the next rule.
[[rule]]
label = ".NET SDK advertising dir"
paths = ["/tmp/*/dotnet-sdk-advertising-temp"]
type = "directory"
empty = true
idle = "1d"

# Discard empty six-character .NET temporary directories.
[[rule]]
label = "empty .NET temp dir"
under = ["/tmp"]
depth = 1
type = "directory"
name = '[A-Za-z0-9]{6}'
empty = true
idle = "1d"

# Discard idle Claude Code scratch entries for this UID.
[[rule]]
label = "scratch"
paths = ["/tmp/claude-%U/*/*", "/tmp/*/claude-%U/*/*"]
idle = "3d"

# Unity Editor compiler pre-warm tests carry the editor's PID.
[[rule]]
label = "Unity VBCS prewarm"
under = ["/tmp"]
depth = 1
type = "file"
name = 'UnityVBCSPreWarm_(?P<pid>[0-9]+)\.(?:cs|rsp|dll|ref\.dll|pdb)'
idle = "3d"

# Mono crash-handler debugger scripts carry the crashed process's PID.
[[rule]]
label = "Mono debugger commands"
under = ["/tmp"]
depth = 1
type = "file"
name = 'mono-gdb-commands\.(?P<pid>[0-9]+)'
idle = "7d"

# Emacs native-compilation worker scripts, read once when the worker starts.
[[rule]]
label = "Emacs compile script"
under = ["/tmp"]
depth = 1
type = "file"
name = 'emacs-async-comp-.+-[A-Za-z0-9]{6}\.el'
idle = "1d"

# Per-version Node.js compile caches for this UID, recreated on demand.
[[rule]]
label = "Node compile cache version"
paths = ["/tmp/node-compile-cache/v*-%U"]
type = "directory"
name = 'v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9_]+-[0-9a-f]{8}-[0-9]+'
idle = "7d"

# Reclaim idle entries with at least 100 MiB of allocated space.
[[rule]]
label = "large entry"
under = ["/tmp"]
depth = 1
min_size = "100M"
idle = "1d"

# Discard idle regular files in shared memory.
[[rule]]
label = "segment"
under = ["/dev/shm"]
depth = 1
type = "file"
idle = "1d"
