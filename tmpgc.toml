# Rules apply in order: an entry belongs to the first rule that matches it.

# .NET diagnostic sockets encode a PID and process start ticks.
[[rule]]
label = "dotnet diagnostic socket"
under = ["/tmp"]
depth = 2
type = "socket"
name = 'dotnet-diagnostic-(?P<pid>[0-9]+)-(?P<start>[0-9]+)-socket'
idle = "0"

# MSBuild sockets encode only a PID.
[[rule]]
label = "MSBuild socket"
under = ["/tmp"]
depth = 2
type = "socket"
name = 'MSBuild(?P<pid>[0-9]+)'
idle = "0"

# Other sockets rely on the bound-socket check.
[[rule]]
label = "socket"
under = ["/tmp"]
depth = 2
type = "socket"
idle = "0"

# CLR debugger pipes encode a PID and process start ticks.
[[rule]]
label = "clr-debug-pipe"
under = ["/tmp"]
depth = 2
type = "fifo"
name = 'clr-debug-pipe-(?P<pid>[0-9]+)-(?P<start>[0-9]+)-(?:in|out)'
idle = "0"

# Numbered MSBuild working directories encode a PID.
[[rule]]
label = "MSBuild dir"
under = ["/tmp"]
depth = 2
type = "directory"
name = 'MSBuild(?P<pid>[0-9]+)'
idle = "0"

# Discard idle MSBuild temporary directories.
[[rule]]
label = "MSBuildTemp"
under = ["/tmp"]
depth = 2
type = "directory"
name = 'MSBuildTemp.*'
idle = "60min"

# Discard empty NuGet case-sensitivity probes.
[[rule]]
label = "NuGet probe"
under = ["/tmp"]
depth = 1
type = "file"
name = 'CASESENSITIVETEST.*'
empty = true
idle = "60min"

# Discard empty .NET SDK advertising-manifest directories. Their parents then match the next rule.
[[rule]]
label = ".NET SDK advertising dir"
paths = ["/tmp/*/dotnet-sdk-advertising-temp"]
type = "directory"
empty = true
idle = "1d"

# Discard empty six-character .NET temporary directories.
[[rule]]
label = "empty .NET temp dir"
under = ["/tmp"]
depth = 1
type = "directory"
name = '[A-Za-z0-9]{6}'
empty = true
idle = "1d"

# Discard idle Claude Code scratch entries for this UID.
[[rule]]
label = "Claude Code scratch"
paths = ["/tmp/claude-%U/*/*", "/tmp/*/claude-%U/*/*"]
idle = "3d"

# Discard idle entries that Claude Code and the commands it runs create directly in its per-UID
# directory. Claude Code's own entries there get the same idle window as its session directories.
#
# Note that Claude Code keeps its own scratch under /tmp/claude-%U, but the commands it runs outside
# its sandbox inherit TMPDIR and pollute /tmp. Merge the following configuration into the
# configuration file at ~/.claude/settings.json to make them create scratch in the same directory:
#
# "env": {
#   "CLAUDE_CODE_TMPDIR": "/tmp",
#   "TMPDIR": "/tmp/claude-1000"
# }
#
# Claude Code places its directory under $CLAUDE_CODE_TMPDIR, else $TMPDIR, so setting TMPDIR alone
# nests it in /tmp/claude-1000/claude-1000. Its sandbox already exports this TMPDIR to commands.
[[rule]]
label = "Claude Code tool scratch"
under = ["/tmp/claude-%U"]
depth = 1
# Keep project directories, whose names start with "-"; the previous rule covers their sessions.
name = '(?s)(?!-).+'
idle = "3d"

# Discard idle scratch entries for this UID created by Codex.
#
# Note that Codex pollutes /tmp with scratch directories by default. Add the following configuration
# to the configuration file at ~/.codex/config.toml to make it create scratch and other artifacts
# under a unified directory:
#
# [shell_environment_policy.set]
# TMPDIR = "/tmp/codex-1000"
#
# [sandbox_workspace_write]
# writable_roots = ["/tmp/codex-1000"]
# exclude_tmpdir_env_var = false  # Allow $TMPDIR
# exclude_slash_tmp = true        # Disallow /tmp
[[rule]]
label = "Codex scratch"
under = ["/tmp/codex-%U"]
depth = 1
# Keep hidden entries and the shared Bubblewrap registry.
name = '(?s)(?!\.|codex-bwrap-synthetic-mount-targets-[0-9]+\Z).+'
idle = "1d"

# Unity Editor compiler pre-warm tests carry the editor's PID.
[[rule]]
label = "Unity VBCS prewarm"
under = ["/tmp"]
depth = 1
type = "file"
name = 'UnityVBCSPreWarm_(?P<pid>[0-9]+)\.(?:cs|rsp|dll|ref\.dll|pdb)'
idle = "3d"

# Mono crash-handler debugger scripts carry the crashed process's PID.
[[rule]]
label = "Mono debugger commands"
under = ["/tmp"]
depth = 1
type = "file"
name = 'mono-gdb-commands\.(?P<pid>[0-9]+)'
idle = "7d"

# Emacs native-compilation worker scripts, read once when the worker starts.
[[rule]]
label = "Emacs compile script"
under = ["/tmp"]
depth = 1
type = "file"
name = 'emacs-async-comp-.+-[A-Za-z0-9]{6}\.el'
idle = "1d"

# Per-version Node.js compile caches for this UID, recreated on demand.
[[rule]]
label = "Node compile cache version"
paths = ["/tmp/node-compile-cache/v*-%U"]
type = "directory"
name = 'v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9_]+-[0-9a-f]{8}-[0-9]+'
idle = "7d"

# Reclaim idle entries with at least 100 MiB of allocated space.
[[rule]]
label = "large entry"
under = ["/tmp"]
depth = 1
min_size = "100M"
idle = "1d"

# Discard idle regular files in shared memory.
[[rule]]
label = "segment"
under = ["/dev/shm"]
depth = 1
type = "file"
idle = "1d"
